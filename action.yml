name: "gh-ci-truth"
description: >-
  Classify whether a pull request's CI actually ran. Detects pull requests
  whose workflow runs were never approved, or whose approval expired after
  30 days, which leave no check run attached to the head commit and so
  render as a clean checks panel.
author: "Manu Nicholas Jacob"

branding:
  icon: "alert-triangle"
  color: "orange"

inputs:
  token:
    description: >-
      Token used to read the pull request, its workflow runs and their job
      counts. The default GITHUB_TOKEN with `pull-requests: read` and
      `actions: read` is enough. This action makes no write calls.
    required: false
    default: ${{ github.token }}
  pr-number:
    description: >-
      Pull request to examine. Defaults to the pull request of the
      triggering event, so on a pull_request or issue_comment trigger this
      can be left unset.
    required: false
    default: ""
  repo:
    description: "Repository as OWNER/REPO. Defaults to the current repository."
    required: false
    default: ""
  label:
    description: >-
      Label name to report in the `label` output when a pull request was
      never actually tested. This action does not apply it; add your own
      step, so the write permission stays visible in your workflow.
    required: false
    default: "ci-never-ran"
  fail-on-untested:
    description: >-
      Fail this step when the pull request was never actually tested.
      Default false, so the action reports without blocking.
    required: false
    default: "false"
  fail-on-unknown:
    description: "Fail this step when the CI state could not be determined."
    required: false
    default: "false"
  shallow:
    description: >-
      Skip the older-commit and repository-workflow lookups. Fewer API
      calls, but NO_CI_CONFIGURED and STALE_RESULTS_FOR_OLDER_COMMIT then
      collapse into UNKNOWN.
    required: false
    default: "false"
  expiry-gap-days:
    description: >-
      Minimum created-to-updated gap, in days, for a zero-job failed run to
      be read as an expired approval rather than a genuine failure.
    required: false
    default: "29.0"

outputs:
  category:
    description: >-
      One of TESTED_PASSING, TESTED_FAILING, NEVER_RAN_AWAITING_APPROVAL,
      NEVER_RAN_EXPIRED, NO_CI_CONFIGURED,
      STALE_RESULTS_FOR_OLDER_COMMIT, UNKNOWN.
    value: ${{ steps.ci-truth.outputs.category }}
  tested:
    description: "true when the head commit produced at least one test result."
    value: ${{ steps.ci-truth.outputs.tested }}
  never-actually-tested:
    description: "true when the head commit has produced no test result of its own."
    value: ${{ steps.ci-truth.outputs.never-actually-tested }}
  misleading:
    description: >-
      true when the pull request is untested AND nothing attached to the
      head commit is failing, so the checks panel reads as clean. This is
      the output to gate a label or a comment on.
    value: ${{ steps.ci-truth.outputs.misleading }}
  should-label:
    description: "Convenience alias for never-actually-tested."
    value: ${{ steps.ci-truth.outputs.should-label }}
  label:
    description: "The label name passed in, echoed for use in a later step."
    value: ${{ steps.ci-truth.outputs.label }}
  confidence:
    description: "high, medium or low."
    value: ${{ steps.ci-truth.outputs.confidence }}
  headline:
    description: "One line describing the category, fit for a comment title."
    value: ${{ steps.ci-truth.outputs.headline }}
  reason:
    description: "Why this category was chosen, naming the workflows involved."
    value: ${{ steps.ci-truth.outputs.reason }}
  head-sha:
    description: "The head commit the verdict applies to."
    value: ${{ steps.ci-truth.outputs.head-sha }}
  jobs-executed:
    description: "Number of Actions jobs that actually ran on the head commit."
    value: ${{ steps.ci-truth.outputs.jobs-executed }}
  comment-body:
    description: "A Markdown report, ready to post as a pull request comment."
    value: ${{ steps.ci-truth.outputs.comment-body }}
  json:
    description: "The full verdict, including every run and check inspected."
    value: ${{ steps.ci-truth.outputs.json }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Classify the pull request's real CI state
      id: ci-truth
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        GITHUB_TOKEN: ${{ inputs.token }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_LABEL: ${{ inputs.label }}
        INPUT_FAIL_ON_UNTESTED: ${{ inputs.fail-on-untested }}
        INPUT_FAIL_ON_UNKNOWN: ${{ inputs.fail-on-unknown }}
        INPUT_SHALLOW: ${{ inputs.shallow }}
        INPUT_EXPIRY_GAP_DAYS: ${{ inputs.expiry-gap-days }}
      run: python -m gh_ci_truth.action
